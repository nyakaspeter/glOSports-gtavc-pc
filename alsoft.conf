# OpenAL Soft settings for re3/reVC on goodluckOS (A33). OpenAL reads this file
# from the game binary's folder. GTA's sounds are mostly 22050 Hz, so mixing at
# that rate with a cheap resampler loses nothing audible and roughly halves the
# mixer's CPU use.
[general]
drivers = alsa
frequency = 22050
resampler = point
period_size = 1024
periods = 3
